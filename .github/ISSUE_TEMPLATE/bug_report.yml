name: Bug report
description: Something does not work as the APIC Help says.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: APIC version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and board
      placeholder: Windows 11 / Debian 13 on Raspberry Pi 5 ...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: printed
    attributes:
      label: What the CoreEngine printed
      description: Copy the console text. Remove addresses or names you may not share.
      render: text
  - type: textarea
    id: config
    attributes:
      label: The streams.json / config.json lines involved
      render: json
